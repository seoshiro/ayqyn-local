name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint site scripts --max-warnings 0
      - run: node scripts/build-site.mjs
      - run: node scripts/audit-site-build.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/fetch-site-audit-tool.mjs
      - name: Production-base browser audit
        env:
          AYQYN_AXE_PATH: data/axe-site.min.js
        run: |
          node scripts/serve-site.mjs > /tmp/ayqyn-site.log 2>&1 &
          node scripts/audit-site-ui.mjs
          node scripts/audit-browser-storage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-audit
          path: artifacts/website-candidate
