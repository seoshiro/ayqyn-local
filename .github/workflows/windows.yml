name: Windows local runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaged-cv:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:assets
      - run: pnpm lint
      - run: node --test tests/*.test.mjs
      - run: node scripts/package-windows.mjs
      - run: node scripts/audit-packaged.mjs
      - run: node scripts/audit-export-replacement.mjs
      - name: Repeated startup, policy and recoverable module checks
        env:
          AYQYN_PACKAGE_DIR: release/AYQYN-win32-x64
          AYQYN_EXECUTABLE: release/AYQYN-win32-x64/AYQYN.exe
          AYQYN_EVIDENCE_DIR: artifacts/independent-ci
        run: |
          node scripts/audit-policy.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit-startup.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit-bootstrap.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit-cancel-inference.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -File scripts/audit-native-start.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/audit-wasm.mjs
      - name: Print bounded audit reports
        if: always()
        shell: pwsh
        run: |
          Get-Content evidence/packaged-audit.json -ErrorAction SilentlyContinue
          Get-Content evidence/wasm-runtime-audit.json -ErrorAction SilentlyContinue
          Get-Content artifacts/export-replacement/export-replacement-audit.json -ErrorAction SilentlyContinue
